<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доска</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // тема: авто (как в системе), светлая или тёмная — выбирается на доске
  (function () {
    var t = 'auto';
    try { t = JSON.parse(localStorage.getItem('wb:theme') || '"auto"'); } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
  :root {
    --paper: #f7f5ef; --card: #ffffff; --ink: #1d2a3a; --muted: #64707d; --line: #e2ddd1;
    --accent: #2457c5; --accent-ink: #ffffff; --grid: #dfe7f3; --hover: #f2f0ea; --input: #fbfaf7; --secondary: #eef1f6;
    --thumb: #fffefb; --danger: #c2372b;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #14181e; --card: #1d232c; --ink: #e6ebf2; --muted: #95a1b0; --line: #2d3541;
    --accent: #5b8dff; --accent-ink: #0e1420; --grid: #1f2631; --hover: #262e3a; --input: #161b22; --secondary: #2a323e;
    --thumb: #171b22; --danger: #ff7a6e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
  }
  main { max-width: 980px; margin: 0 auto; padding: 56px 16px 48px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 26px; }
  h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; justify-content: flex-end; min-width: 280px; }
  button {
    font: inherit; font-weight: 600; border: 0; cursor: pointer; border-radius: 10px;
    padding: 12px 18px; background: var(--accent); color: var(--accent-ink);
  }
  button:hover { filter: brightness(1.07); }
  button.secondary { background: var(--secondary); color: var(--ink); }
  form.join { display: flex; gap: 8px; flex: 1; max-width: 420px; min-width: 240px; }
  input {
    font: inherit; flex: 1; min-width: 0; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; margin: -12px 0 14px; }
  #status:empty { display: none; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 26px 0 12px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .board {
    position: relative; display: block; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.06);
    transition: transform .22s cubic-bezier(.2,.9,.25,1), box-shadow .22s; animation: rise .4s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .board:hover { transform: translateY(-4px); box-shadow: 0 2px 6px rgba(0,0,0,.08), 0 16px 34px rgba(0,0,0,.14); }
  .board .pic { aspect-ratio: 16 / 10; background: var(--thumb) center / cover no-repeat; border-bottom: 1px solid var(--line);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
  .board .pic.has { background-size: cover; }
  .board .meta { padding: 10px 12px 11px; }
  .board b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board small { color: var(--muted); font-size: 12.5px; }
  .board .x {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0; border-radius: 8px; font-size: 17px; line-height: 1;
    background: var(--card); color: var(--muted); border: 1px solid var(--line); opacity: 0; transition: opacity .15s;
  }
  .board:hover .x, .board .x:focus { opacity: 1; }
  .board .x:hover { color: var(--danger); filter: none; }
  .board.new { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 190px; cursor: pointer;
    border: 2px dashed var(--line); background: transparent; box-shadow: none; color: var(--muted); font-weight: 600; font-size: 15px; padding: 0; }
  .board.new:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  .board.new svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .note { color: var(--muted); font-size: 13.5px; margin-top: 18px; line-height: 1.5; }
  .board .tag { position: absolute; top: 8px; left: 8px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); }
  @media (hover: none) { .board .x { opacity: 1; } }
  .modal { position: fixed; inset: 0; background: rgba(10,14,20,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .card h3 { margin: 0 0 6px; font-size: 20px; }
  .card p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 6px 0 12px; }
  .card p.err { color: var(--danger); }
  .card textarea { width: 100%; font: 12.5px ui-monospace, Consolas, monospace; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--input); color: var(--ink); resize: vertical; min-height: 84px; word-break: break-all; }
  .card textarea:focus { outline: none; border-color: var(--accent); }
  .card .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .card .wait { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 14.5px; margin: 14px 0 4px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .steps { counter-reset: s; list-style: none; padding: 0; margin: 12px 0 0; }
  .steps li { counter-increment: s; position: relative; padding: 0 0 12px 34px; font-size: 14.5px; line-height: 1.45; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 24px; height: 24px; border-radius: 50%; background: var(--secondary); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .steps li.done::before { content: "✓"; background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Доска <span>для уроков</span></h1>
    <div class="actions">
      <form class="join" id="join">
        <input id="link" placeholder="Ссылка на доску" autocomplete="off">
        <button class="secondary" type="submit">Открыть</button>
      </form>
      <button type="button" id="joinCode" hidden>Войти по коду</button>
    </div>
  </div>
  <div id="status"></div>

  <h2 id="listTitle">Мои доски</h2>
  <div class="grid" id="grid"></div>
  <p class="note" id="note" hidden></p>
</main>
<!-- Окно: вход ученика по коду (прямое соединение с компьютером учителя) -->
<div class="modal" id="codeModal" hidden>
  <div class="card">
    <h3>Войти на доску учителя по коду</h3>
    <div id="codeStep1">
      <p>Учитель присылает вам код приглашения. Вставьте его сюда.</p>
      <textarea id="codeIn" placeholder="Код от учителя (начинается с D1.)" spellcheck="false"></textarea>
      <p class="err" id="codeErr" hidden></p>
      <div class="btns">
        <button type="button" class="secondary" data-close>Отмена</button>
        <button type="button" id="codeNext">Далее</button>
      </div>
    </div>
    <div id="codeStep2" hidden>
      <ol class="steps">
        <li class="done">Код учителя принят<span id="codeTitle"></span>.</li>
        <li><b>Отправьте учителю ответный код</b> — сразу, пока он не устарел (около минуты).
          <div class="btns" style="justify-content:flex-start;margin-top:8px"><button type="button" id="codeCopy">Скопировать ответный код</button></div>
        </li>
        <li>Когда учитель вставит его у себя, доска откроется сама.</li>
      </ol>
      <div class="wait"><span class="spinner"></span><span id="codeWait">Жду учителя…</span></div>
      <p class="err" id="codeErr2" hidden></p>
      <div class="btns">
        <button type="button" class="secondary" id="codeAgain">Ввести другой код</button>
        <button type="button" class="secondary" data-close>Закрыть</button>
      </div>
    </div>
  </div>
</div>
<script src="/js/p2p.js"></script>
<script>
  const status = document.getElementById('status');
  const grid = document.getElementById('grid');
  let hostToken = null;

  async function createBoard() {
    status.textContent = 'Создаю… Если сервер спал, это может занять до минуты.';
    try {
      const r = await fetch('/api/boards', { method: 'POST' });
      const { id } = await r.json();
      location.href = '/b/' + id;
    } catch {
      status.textContent = 'Не получилось связаться с сервером. Попробуйте ещё раз.';
    }
  }
  document.getElementById('join').onsubmit = (e) => {
    e.preventDefault();
    const v = document.getElementById('link').value.trim();
    const m = v.match(/(?:\/b\/)?([a-z0-9]{6,20})\/?$/);
    if (m) location.href = '/b/' + m[1];
    else status.textContent = 'Не похоже на ссылку на доску.';
  };

  function readRecent() {
    try {
      const l = JSON.parse(localStorage.getItem('wb:recent') || '[]');
      return Array.isArray(l) ? l.filter((r) => r && r.id) : [];
    } catch { return []; }
  }
  function forget(id) {
    try {
      localStorage.setItem('wb:recent', JSON.stringify(readRecent().filter((r) => r.id !== id)));
      localStorage.removeItem('wb:board:' + id);
    } catch {}
  }
  const fmt = (at) => new Date(at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  function render(boards, local) {
    grid.innerHTML = '';
    const add = document.createElement('button');
    add.className = 'board new';
    add.id = 'create';
    add.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Новая доска</span>';
    add.onclick = createBoard;
    grid.append(add);
    boards.forEach((b, i) => {
      const a = document.createElement('a');
      a.className = 'board';
      a.href = '/b/' + b.id;
      a.style.animationDelay = Math.min(i, 12) * 35 + 'ms';
      const pic = document.createElement('div');
      pic.className = 'pic';
      if (b.thumb && /^data:image\//.test(b.thumb)) {
        pic.classList.add('has');
        pic.style.backgroundImage = `url("${b.thumb}")`;
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      const t = document.createElement('b');
      t.textContent = b.title || 'Без названия';
      const s = document.createElement('small');
      s.textContent = fmt(b.at);
      meta.append(t, s);
      const x = document.createElement('button');
      x.className = 'x';
      x.type = 'button';
      x.textContent = '×';
      x.title = local && b.onDisk ? 'Удалить доску с компьютера' : 'Убрать из списка';
      x.onclick = async (e) => {
        e.preventDefault();
        if (local && b.onDisk) {
          if (!confirm(`Удалить доску «${b.title || 'Без названия'}» с этого компьютера? Отменить это нельзя.`)) return;
          const r = await fetch('/api/boards/' + b.id, { method: 'DELETE', headers: { 'x-host-token': hostToken } });
          if (r.status === 409) return alert('Доска сейчас открыта у кого-то из участников. Закройте её и попробуйте снова.');
        }
        forget(b.id);
        a.remove();
      };
      if (b.remote) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'Доска учителя';
        a.append(tag);
      }
      a.append(pic, meta, x);
      grid.append(a);
    });
  }

  (async () => {
    const recent = readRecent();
    render(recent, false);
    // Если доска запущена на этом компьютере — показываем всё, что лежит на диске
    try {
      const r = await fetch('/api/boards', { cache: 'no-store' });
      const j = await r.json();
      if (j.local) {
        hostToken = j.token;
        const byId = new Map(recent.map((x) => [x.id, x]));
        const list = j.boards.map((b) => ({ ...b, onDisk: true, thumb: (byId.get(b.id) || {}).thumb }));
        // доски учителя, на которые заходили по коду, лежат не на этом компьютере
        const onDisk = new Set(list.map((b) => b.id));
        for (const r of recent) if (P2P.isRemote(r.id) && !onDisk.has(r.id)) list.push({ ...r, remote: true });
        list.sort((x, y) => (y.at || 0) - (x.at || 0));
        document.getElementById('listTitle').textContent = 'Доски на этом компьютере';
        const note = document.getElementById('note');
        note.hidden = false;
        note.textContent = 'Доски хранятся на этом компьютере и доступны другим, пока программа запущена. Чтобы позвать учеников, откройте доску и нажмите «Пригласить».';
        render(list, true);
      }
    } catch {}
  })();

  // ---------- вход по коду ----------
  (async () => {
    const $ = (id) => document.getElementById(id);
    const modal = $('codeModal');
    const JOIN_ERRORS = {
      badcode: 'Это не похоже на код доски. Скопируйте код учителя целиком.',
      notoffer: 'Это ответный код, а не приглашение. Нужен код, который прислал учитель.',
      nobridge: 'Нет связи с модулем соединения. Перезапустите программу.',
      fail: 'Не получилось обработать код. Попросите учителя создать новый.',
    };
    let answer = '';
    let target = '';
    let failTimer = 0;
    function step(n) {
      $('codeStep1').hidden = n !== 1;
      $('codeStep2').hidden = n !== 2;
      $('codeErr').hidden = $('codeErr2').hidden = true;
      if (n === 1) setTimeout(() => $('codeIn').focus(), 30);
    }
    function showErr(id, text) {
      $(id).textContent = text;
      $(id).hidden = false;
    }
    async function copy(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.append(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      if (btn) {
        const old = btn.textContent;
        btn.textContent = 'Скопировано ✓';
        setTimeout(() => (btn.textContent = old), 1600);
      }
    }
    async function join() {
      const code = $('codeIn').value.trim();
      if (!code) return;
      $('codeNext').disabled = true;
      $('codeNext').textContent = 'Готовлю ответ…';
      const r = await P2P.call('guest-join', { code }, 20000);
      $('codeNext').disabled = false;
      $('codeNext').textContent = 'Далее';
      if (r.error) return showErr('codeErr', JOIN_ERRORS[r.error] || JOIN_ERRORS.fail);
      answer = r.code;
      target = r.board;
      P2P.markRemote(target);
      $('codeTitle').textContent = r.title ? ` — доска «${r.title}»` : '';
      step(2);
      copy(answer, $('codeCopy'));
      clearTimeout(failTimer);
    }
    $('codeNext').onclick = join;
    $('codeIn').oninput = () => {
      // вставили код целиком — сразу идём дальше
      if (/D1\.[A-Za-z0-9_-]{60,}/.test($('codeIn').value.replace(/\s+/g, ''))) join();
    };
    $('codeCopy').onclick = () => copy(answer, $('codeCopy'));
    $('codeAgain').onclick = () => {
      $('codeIn').value = '';
      step(1);
    };
    for (const b of modal.querySelectorAll('[data-close]')) b.onclick = () => (modal.hidden = true);
    $('joinCode').onclick = () => {
      $('codeIn').value = '';
      step(1);
      modal.hidden = false;
    };
    P2P.on((m) => {
      if (m.ev !== 'state') return;
      if (m.link && m.link.state === 'connected' && target && m.link.board === target && !modal.hidden) {
        $('codeWait').textContent = 'Соединено! Открываю доску…';
        location.href = '/b/' + target;
      } else if (!m.link && m.lastFail && target && m.lastFail.board === target && !$('codeStep2').hidden) {
        showErr('codeErr2', 'Соединиться не получилось: код устарел или сеть не пропускает прямые соединения. Попросите у учителя новый код и попробуйте ещё раз. Если включён VPN — выключите его.');
        $('codeWait').textContent = 'Соединение не установлено.';
      }
    });

    // кнопка видна, только когда есть модуль соединения (приложение или служебная вкладка)
    const st = await P2P.status();
    if (st.error) return;
    $('joinCode').hidden = false;
    if (new URLSearchParams(location.search).has('join')) $('joinCode').onclick();
  })();
  window.matchMedia && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload());
</script>
</body>
</html>
