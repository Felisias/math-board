<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доска</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // тема: авто (как в системе), светлая или тёмная — выбирается на доске
  (function () {
    var t = 'auto';
    try { t = JSON.parse(localStorage.getItem('wb:theme') || '"auto"'); } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
  :root {
    --paper: #f7f5ef; --card: #ffffff; --ink: #1d2a3a; --muted: #64707d; --line: #e2ddd1;
    --accent: #2457c5; --accent-ink: #ffffff; --grid: #dfe7f3; --hover: #f2f0ea; --input: #fbfaf7; --secondary: #eef1f6;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #14181e; --card: #1d232c; --ink: #e6ebf2; --muted: #95a1b0; --line: #2d3541;
    --accent: #5b8dff; --accent-ink: #0e1420; --grid: #1f2631; --hover: #262e3a; --input: #161b22; --secondary: #2a323e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px 48px; }
  h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; margin: 0 0 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border: 0; cursor: pointer; border-radius: 10px;
    padding: 12px 18px; background: var(--accent); color: var(--accent-ink);
  }
  button:hover { filter: brightness(1.07); }
  button.secondary { background: var(--secondary); color: var(--ink); }
  #create { width: 100%; font-size: 17px; padding: 15px; }
  input {
    font: inherit; flex: 1; min-width: 200px; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--input); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 0; }
  li a {
    display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px;
    color: var(--ink); text-decoration: none;
  }
  li a:hover { background: var(--hover); }
  li small { color: var(--muted); white-space: nowrap; }
  #status { color: var(--muted); font-size: 14px; margin-top: 10px; min-height: 20px; }
  #status:empty { display: none; }
  #recentCard[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Доска <span>для уроков</span></h1>

  <div class="card">
    <button id="create">Создать доску</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>Войти по ссылке</h2>
    <form class="row" id="join">
      <input id="link" placeholder="Ссылка на доску" autocomplete="off">
      <button class="secondary" type="submit">Открыть</button>
    </form>
  </div>

  <div class="card" id="recentCard" hidden>
    <h2>Мои доски</h2>
    <ul id="recent"></ul>
  </div>
</main>
<script>
  const status = document.getElementById('status');
  document.getElementById('create').onclick = async () => {
    status.textContent = 'Создаю… Если сервер спал, это может занять до минуты.';
    try {
      const r = await fetch('/api/boards', { method: 'POST' });
      const { id } = await r.json();
      location.href = '/b/' + id;
    } catch {
      status.textContent = 'Не получилось связаться с сервером. Попробуйте ещё раз.';
    }
  };
  document.getElementById('join').onsubmit = (e) => {
    e.preventDefault();
    const v = document.getElementById('link').value.trim();
    const m = v.match(/(?:\/b\/)?([a-z0-9]{6,20})\/?$/);
    if (m) location.href = '/b/' + m[1];
    else status.textContent = 'Не похоже на ссылку на доску.';
  };
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem('wb:recent') || '[]'); } catch {}
  const ul = document.getElementById('recent');
  if (recent.length) document.getElementById('recentCard').hidden = false;
  for (const r of recent) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '/b/' + r.id;
    const name = document.createElement('span');
    name.textContent = r.title || 'Доска ' + r.id;
    const when = document.createElement('small');
    when.textContent = new Date(r.at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    a.append(name, when);
    li.append(a);
    ul.append(li);
  }
  window.matchMedia && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => location.reload());
</script>
</body>
</html>
