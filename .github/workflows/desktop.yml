name: Приложение для Windows

# Собирает установщик и переносную версию приложения и кладёт их в Releases
# (выпуск «Приложение для Windows»). Запускается при изменениях доски в ветке main
# или вручную: Actions → «Приложение для Windows» → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'server.js'
      - 'tunnel.js'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установка зависимостей
        working-directory: desktop
        run: npm install
      - name: Сборка
        working-directory: desktop
        run: npm run dist
      - name: Файлы сборки
        uses: actions/upload-artifact@v4
        with:
          name: Doska-Windows
          path: desktop/dist/*.exe
      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: Приложение для Windows
          body: |
            Свежая сборка приложения «Доска» для Windows.

            - **Doska-Setup.exe** — установщик (появится ярлык «Доска»)
            - **Doska-Portable.exe** — запускается без установки

            При первом запуске Windows может показать предупреждение SmartScreen: «Подробнее» → «Выполнить в любом случае».
          files: desktop/dist/*.exe
